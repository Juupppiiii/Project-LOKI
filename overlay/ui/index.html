<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LOKI</title>
    <meta
      name="description"
      content="LOKI — human-in-the-loop ticket automation. Execution is simulated."
    />
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong colours. Kept inline and tiny on purpose.
      (function () {
        try {
          var saved = localStorage.getItem("overlay-theme");
          var theme =
            saved ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
