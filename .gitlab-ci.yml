# PROJECT STEPH — GitLab CI/CD Pipeline
#
# Three stages:
#   test    — lint + full pytest suite (122 tests, no external deps)
#   build   — Docker image build (validates the container works)
#   deploy  — placeholder for future AWS ECS deployment
#
# Runs on every push and merge request. No secrets needed for test/build.

stages:
  - test
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  LOKI_EXECUTION_MODE: "simulation"
  LOKI_STORE_BACKEND: "sqlite"
  LOKI_ENFORCE_SOD: "0"          # CI runs same-actor approve+execute in tests

# ---------------------------------------------------------------------------
# Stage: test
# ---------------------------------------------------------------------------

lint:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet ruff
  script:
    - ruff check overlay/ system2/ scripts/ tests/ --select E,F,W --ignore E501,W503 --exit-zero
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:
  stage: test
  image: python:3.12-slim
  cache:
    key: pip-cache
    paths:
      - .cache/pip
  before_script:
    - pip install --quiet -r requirements-api.txt -r requirements-dev.txt
  script:
    - python -m pytest -q --tb=short --junitxml=junit.xml
  artifacts:
    when: always
    reports:
      junit: junit.xml
    paths:
      - junit.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

terraform-validate:
  stage: test
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd infrastructure/environments/dev
  script:
    - terraform fmt -check -recursive ../..
    - terraform init -backend=false
    - terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - infrastructure/**/*
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - infrastructure/**/*

# ---------------------------------------------------------------------------
# Stage: build
# ---------------------------------------------------------------------------

docker-build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    # Tag latest on main branch only
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ---------------------------------------------------------------------------
# Stage: deploy (placeholder — blocked on AWS account/bootstrap decision)
# ---------------------------------------------------------------------------

deploy-dev:
  stage: deploy
  image:
    name: hashicorp/terraform:1.9
    entrypoint: [""]
  before_script:
    - cd infrastructure/environments/dev
  script:
    # GitLab-managed state; TF_* backend vars come from CI/CD settings.
    - terraform init
      -backend-config="address=${TF_STATE_ADDRESS}"
      -backend-config="lock_address=${TF_STATE_ADDRESS}/lock"
      -backend-config="unlock_address=${TF_STATE_ADDRESS}/lock"
      -backend-config="username=${TF_STATE_USERNAME}"
      -backend-config="password=${TF_STATE_PASSWORD}"
    - terraform apply -auto-approve -var-file=dev.tfvars
      -var="api_image_tag=${CI_COMMIT_SHORT_SHA}"
      -var="worker_image_tag=${CI_COMMIT_SHORT_SHA}"
  # Manual gate: blocked until the platform automation role, VPC/subnets, cert,
  # and dev.tfvars are provided. See deploy/README.md and infrastructure/README.md.
  when: manual
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
