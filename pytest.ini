[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: pure logic, no I/O
    repository: exercises a Store backend
    integration: full propose->approve->execute flow
    concurrency: multi-connection coordination
    migration: SQLite/PostgreSQL migration tooling
    postgres: requires a reachable PostgreSQL (BUCKY_TEST_POSTGRES_DSN)
    cdk: asserts on synthesized CloudFormation templates
